name: SpectraNetworkManager CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-linux:
    name: Core Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Core Tests on Linux
        run: dotnet test tests/SpectraNetworkManager.Tests/SpectraNetworkManager.Tests.csproj -c Release --logger "trx;LogFileName=test-results-linux.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: tests/SpectraNetworkManager.Tests/TestResults/test-results-linux.trx

  windows-build-and-test:
    name: Solution Build & Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Full Solution (WPF + Core + Platform + Tests)
        run: dotnet build SpectraNetworkManager.sln -c Release

      - name: Run All Tests (Elevated Runner)
        run: dotnet test SpectraNetworkManager.sln -c Release --no-build --logger "trx;LogFileName=test-results-windows.trx"
        env:
          CI: "true"

      - name: Publish SpectraNetworkManager App
        run: dotnet publish src/SpectraNetworkManager.App/SpectraNetworkManager.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish/SpectraNetworkManager

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraNetworkManager-win-x64
          path: publish/SpectraNetworkManager/
